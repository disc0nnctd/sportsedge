[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sportsedge"
version = "0.1.0"
description = "Shared betting-analytics core: devig, edge/Kelly sizing, ledger, CLV, calibration, Elo"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sportsedge = "sportsedge.cli:main"

[tool.setuptools.packages.find]
include = ["sportsedge*"]
